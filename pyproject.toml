[project]
name = "kw6"
version = "0.0.0"
description = "Minimalistic library for reading files in the kw6 file format"
authors = [{ name = "NextML AB" }]
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.21.2,<2",
    "Pillow>=10.0,<12",
    "pydantic>=2.0.0,<3",
]

[dependency-groups]
dev = [
    "tqdm>=4.62.2,<5",
    "pytest>=6.2.5,<7",
    "flake8>=3.9.2,<4",
    "ipykernel>=6.4.1,<7",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
